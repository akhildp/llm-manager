<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Manager — Local Model Interface</title>
    <meta name="description" content="Manage and chat with local LLMs powered by llama.cpp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z" />
                        <path d="M2 17l10 5 10-5" />
                        <path d="M2 12l10 5 10-5" />
                    </svg>
                </div>
                <h1>LLM Manager</h1>
            </div>
            <button class="sidebar-close-btn" id="sidebar-close-btn" aria-label="Close sidebar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Server Status -->
        <div class="status-card" id="status-card">
            <div class="status-header">
                <span class="status-dot" id="status-dot"></span>
                <span class="status-text" id="status-text">Idle</span>
            </div>
            <div class="status-details" id="status-details"></div>
        </div>

        <!-- Models List -->
        <div class="sidebar-section">
            <h3 class="section-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                </svg>
                Models
            </h3>
            <div class="model-selector-container">
                <div class="custom-select" id="model-select">
                    <div class="select-trigger" id="select-trigger">
                        <span class="placeholder">Select a model...</span>
                        <div class="select-arrow">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <polyline points="6 9 12 15 18 9" />
                            </svg>
                        </div>
                    </div>
                    <div class="select-options" id="select-options">
                        <!-- Options injected by JS -->
                    </div>
                </div>

                <!-- Action Buttons (only visible when model selected) -->
                <div class="model-actions-bar" id="model-actions-bar" style="display: none;">
                    <div class="selected-model-info" id="selected-model-info"></div>
                    <div class="action-buttons">
                        <button class="btn btn-primary btn-block" id="start-model-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <polygon points="5 3 19 12 5 21 5 3" />
                            </svg>
                            Start Model
                        </button>
                        <button class="btn btn-danger btn-block" id="stop-model-btn" style="display: none;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="6" y="6" width="12" height="12" />
                            </svg>
                            Stop
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings -->
        <div class="sidebar-section">
            <h3 class="section-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
                Settings
            </h3>
            <div class="settings-panel">
                <div class="setting-item">
                    <label for="ctx-size">Context Size</label>
                    <div class="setting-control">
                        <input type="range" id="ctx-size" min="512" max="32768" value="4096" step="512">
                        <span class="setting-value" id="ctx-size-value">4096</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label for="gpu-layers">GPU Layers</label>
                    <div class="setting-control">
                        <input type="range" id="gpu-layers" min="0" max="99" value="20" step="1">
                        <span class="setting-value" id="gpu-layers-value">20</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label for="max-tokens">Max Tokens</label>
                    <div class="setting-control">
                        <input type="range" id="max-tokens" min="128" max="32768" value="2048" step="128">
                        <span class="setting-value" id="max-tokens-value">2048</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label for="temperature">Temperature</label>
                    <div class="setting-control">
                        <input type="range" id="temperature" min="0" max="2" value="0.7" step="0.1">
                        <span class="setting-value" id="temperature-value">0.7</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label for="repeat-penalty">Repeat Penalty</label>
                    <div class="setting-control">
                        <input type="range" id="repeat-penalty" min="1.0" max="2.0" value="1.1" step="0.01">
                        <span class="setting-value" id="repeat-penalty-value">1.10</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label for="top-p">Top P</label>
                    <div class="setting-control">
                        <input type="range" id="top-p" min="0.0" max="1.0" value="0.9" step="0.01">
                        <span class="setting-value" id="top-p-value">0.90</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label for="enable-tools">
                        <input type="checkbox" id="enable-tools" checked>
                        Enable Tools (Web Browse)
                    </label>
                </div>
            </div>
        </div>

        <!-- System Prompt -->
        <div class="sidebar-section">
            <h3 class="section-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="16" y1="13" x2="8" y2="13" />
                    <line x1="16" y1="17" x2="8" y2="17" />
                </svg>
                System Prompt
            </h3>
            <textarea id="system-prompt" rows="4"
                placeholder="Optional system prompt...">You are a helpful AI assistant. Use the web_browse tool whenever you need current info (news, sports, weather, etc.) to answer the user accurately. Avoid using it for greetings.</textarea>
        </div>
    </aside>

    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Chat Header -->
        <div class="chat-header" id="chat-header">
            <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>
            <div class="chat-header-info">
                <h2 id="active-model-name">No model loaded</h2>
                <span class="chat-header-badge" id="chat-header-badge">idle</span>
            </div>
            <button class="btn btn-ghost" id="clear-chat-btn" title="Clear conversation">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                </svg>
            </button>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" id="chat-messages">
            <div class="welcome-screen" id="welcome-screen">
                <div class="welcome-icon">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#a855f7" />
                                <stop offset="100%" style="stop-color:#06b6d4" />
                            </linearGradient>
                        </defs>
                        <path d="M12 2L2 7l10 5 10-5-10-5z" />
                        <path d="M2 17l10 5 10-5" />
                        <path d="M2 12l10 5 10-5" />
                    </svg>
                </div>
                <h2>Welcome to LLM Manager</h2>
                <p>Select a model from the sidebar and start it to begin chatting.</p>
                <div class="welcome-features">
                    <div class="feature-card">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                        </svg>
                        <span>Streaming Chat</span>
                    </div>
                    <div class="feature-card">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="2" y1="12" x2="22" y2="12" />
                            <path
                                d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
                        </svg>
                        <span>Web Browsing</span>
                    </div>
                    <div class="feature-card">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="4" y="4" width="16" height="16" rx="2" ry="2" />
                            <rect x="9" y="9" width="6" height="6" />
                            <line x1="9" y1="1" x2="9" y2="4" />
                            <line x1="15" y1="1" x2="15" y2="4" />
                            <line x1="9" y1="20" x2="9" y2="23" />
                            <line x1="15" y1="20" x2="15" y2="23" />
                            <line x1="20" y1="9" x2="23" y2="9" />
                            <line x1="20" y1="14" x2="23" y2="14" />
                            <line x1="1" y1="9" x2="4" y2="9" />
                            <line x1="1" y1="14" x2="4" y2="14" />
                        </svg>
                        <span>GPU Accelerated</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Input -->
        <div class="chat-input-area" id="chat-input-area">
            <div id="image-preview" class="image-preview" style="display: none;">
                <img id="preview-img" src="" alt="Upload preview">
                <button id="clear-image-btn" class="clear-image-btn" title="Remove image">×</button>
            </div>
            <div class="chat-input-wrap">
                <button class="attach-btn" id="attach-btn" title="Upload chart/image" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                    </svg>
                </button>
                <input type="file" id="file-input" accept="image/*" style="display: none;">
                <textarea id="chat-input" placeholder="Send a message (paste or drop chart here)..." rows="1"
                    disabled></textarea>
                <button class="send-btn" id="send-btn" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13" />
                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                    </svg>
                </button>
            </div>
            <div class="chat-input-hint">
                <span id="input-hint">Start a model to begin chatting</span>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
</body>

</html>
